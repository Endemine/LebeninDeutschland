name: einbuergerungstest
description: "Einbuergerungstest Pro - Leben in Deutschland"
publish_to: 'none'
version: 1.1.3+32
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_timer_countdown: ^1.0.7
  confetti: ^0.8.0
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.4
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Roboto liegt als Variable Font im Bundle. Vorher wurde die Schrift ueber
  # google_fonts zur Laufzeit von Googles Servern geladen, was die IP-Adresse
  # des Nutzers uebertragen hat -- siehe Kommentar in lib/app_fonts.dart.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
  assets:
    - assets/questions.json
    - assets/fonts/OFL.txt
    - assets/translations.json
    - assets/wappen/
    - assets/questions/
